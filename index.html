  window.tailwind = window.tailwind || {};

    theme: {

          ink: "#05070f",
          panel: "#0b111f",
          bone: "#ece6d8",
          muted: "#8d97ac",
          amber: "#f5a623",

<body class="min-h-screen font-sans antialiased">
<div class="grain" aria-hidden="true"></div>

<header class="relative z-10 mx-auto flex w-full max-w-[1800px] flex-wrap items-center gap-x-6 gap-y-3 px-4 pb-3 pt-5">
  <div class="flex items-center gap-3">
    <div class="grid h-11 w-11 place-items-center rounded-2xl border border-white/10 bg-white/[0.03] shadow-[inset_0_1px_0_rgba(255,255,255,0.06)]">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9.2" stroke="#f5a623" stroke-width="1.3" opacity="0.9" />
        <ellipse cx="12" cy="12" rx="9.2" ry="3.6" stroke="#63e0ce" stroke-width="1" opacity="0.65" />
        <circle cx="12" cy="12" r="3.1" fill="#63e0ce" opacity="0.85" />
      </svg>
    </div>
    <div>
      <h1 class="wordmark font-display">RADIUM</h1>
      <p class="eyebrow mt-1">Terrestrial analog intelligence</p>
    </div>
  </div>

  <nav id="body-tabs" class="flex items-center gap-1 rounded-full border border-white/10 bg-white/[0.03] p-1" role="tablist" aria-label="Target body"></nav>

  <div class="ml-auto flex items-center gap-2">
    <button id="btn-mission" class="layer-btn" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2.4" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="17" r="2.4" stroke="currentColor" stroke-width="1.6"/></svg>
      Mission designer
    </button>
    <button id="btn-sources" class="layer-btn" type="button">Data &amp; method</button>
  </div>
</header>

<main class="relative z-10 mx-auto grid w-full max-w-[1800px] gap-3 px-4 pb-5 lg:h-[calc(100vh-104px)] lg:grid-cols-[302px_minmax(0,1fr)_368px]">

  <aside class="panel flex min-h-[260px] flex-col overflow-hidden lg:min-h-0">
    <div class="flex items-baseline justify-between border-b border-white/[0.06] px-4 pb-3 pt-4">
      <div class="min-w-0">
        <p class="eyebrow">Ranked shortlist</p>
        <p id="rail-title" class="mt-1 text-sm text-bone">Lunar base sites</p>
        <p id="rail-sub" class="mt-0.5 hidden text-[11px] leading-snug text-ice/85"></p>
      </div>
      <span id="rail-count" class="chip">10</span>
    </div>
    <div id="rail-split" class="hidden gap-1.5 border-b border-white/[0.06] px-3 py-2">
      <button type="button" class="set-btn" data-set="curated" aria-pressed="true">Curated</button>
      <button type="button" class="set-btn" data-set="discovered" aria-pressed="false">Discovered</button>
    </div>
    <div id="rail-list" class="scroll flex-1 overflow-y-auto p-2"></div>
    <div class="border-t border-white/[0.06] px-4 py-3">
      <p id="rail-note" class="text-[11px] leading-relaxed text-muted"></p>
    </div>
  </aside>

  <section class="panel relative isolate min-h-[420px] overflow-hidden lg:min-h-0">
    <div id="view-globe" class="absolute inset-0"></div>
    <div id="view-earth" class="absolute inset-0 hidden"></div>

    <div class="pointer-events-none absolute inset-x-3 top-3 z-[1200] flex flex-wrap items-start justify-between gap-2">
      <div id="stage-label" class="pointer-events-auto rounded-xl border border-white/10 bg-[#070c17]/70 px-3 py-2 backdrop-blur-md">
        <p class="eyebrow">Now viewing</p>
        <p id="stage-title" class="mt-0.5 text-sm">Lunar south pole</p>
      </div>
      <div id="layer-controls" class="pointer-events-auto flex min-w-0 flex-wrap justify-end gap-1.5" role="group" aria-label="Map layers"></div>
    </div>

    <div id="layer-popover" class="layer-popover pointer-events-auto absolute right-3 top-[3.4rem] z-[1300]" hidden></div>

    <div id="legend" class="pointer-events-none absolute bottom-3 left-3 z-[1200] max-w-[280px] rounded-xl border border-white/10 bg-[#070c17]/75 px-3 py-2 backdrop-blur-md"></div>

    <div id="twin-banner" class="pointer-events-auto absolute inset-x-3 bottom-3 z-[1200] hidden"></div>

    <div id="globe-zoom" class="globe-zoom absolute bottom-3 right-3 z-[1200]" role="group" aria-label="Zoom the globe">
      <button type="button" data-globe-zoom="in" aria-label="Zoom in" title="Zoom in">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
      <button type="button" data-globe-zoom="out" aria-label="Zoom out" title="Zoom out">
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none">
          <path d="M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </section>

  <aside class="panel flex min-h-[320px] flex-col overflow-hidden">
    <div id="detail" class="scroll flex-1 overflow-y-auto p-4"></div>
  </aside>
</main>

<dialog id="mission-dialog" class="w-full">
  <form method="dialog" class="p-5">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="eyebrow">Mission designer</p>
        <h2 class="mt-1 font-display text-2xl">Weight the trade space</h2>
        <p class="mt-1 text-xs leading-relaxed text-muted">Move the sliders; every pin is re-graded live against your priorities.</p>
      </div>
      <button class="layer-btn" type="submit" aria-label="Close">Close</button>
    </div>
    <div id="weight-controls" class="mt-4 grid gap-3 sm:grid-cols-2"></div>
    <div class="mt-4 flex flex-wrap items-center gap-2">
      <span class="eyebrow mr-1">Presets</span>
      <button class="layer-btn" type="button" data-preset="balanced">Balanced</button>
      <button class="layer-btn" type="button" data-preset="ice">Ice-first base</button>
      <button class="layer-btn" type="button" data-preset="solar">Solar-first base</button>
      <button class="layer-btn" type="button" data-preset="science">Science-first</button>
      <button class="layer-btn" type="button" data-preset="landing">Safest landing</button>
    </div>
  </form>
</dialog>

<dialog id="sources-dialog" class="w-full">
  <form method="dialog" class="p-5">
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="eyebrow">Data &amp; method</p>
        <h2 class="mt-1 font-display text-2xl">What is measured, what is estimated</h2>
      </div>
      <button class="layer-btn" type="submit" aria-label="Close">Close</button>
    </div>
    <div id="sources-body" class="scroll mt-4 max-h-[62vh] overflow-y-auto pr-1 text-sm leading-relaxed"></div>
  </form>
</dialog>

<dialog id="viewer-dialog" class="w-full max-w-[min(97vw,1240px)]">
  <div id="viewer-body"></div>
</dialog>
